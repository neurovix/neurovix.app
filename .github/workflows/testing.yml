name: Testing CI

on:
  push:
    branches: [testing]
  workflow_dispatch:

concurrency:
  group: testing-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm run --if-present test

      - name: Build
        run: pnpm build

  open-pr:
    name: Open PR testing → main
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Create PR if none is open
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          existing=$(gh pr list --repo "$REPO" --base main --head testing --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            echo "PR #$existing already open; new commits are included automatically."
            exit 0
          fi
          gh pr create --repo "$REPO" --base main --head testing \
            --title "Merge testing into main" \
            --body "Automated PR: all checks passed on \`testing\` (commit ${GITHUB_SHA::7}). [Workflow run](${GITHUB_SERVER_URL}/${REPO}/actions/runs/${GITHUB_RUN_ID})"
